<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Will you be my Valentine?</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #ffe6f0;
        overflow: hidden;
        text-align: center;
      }

      video {
        width: 50%;
        max-width: 200px;
        margin-bottom: 20px;
        border-radius: 12px;
      }

      h1 {
        color: #d6006c;
        font-size: 24px;
        margin-bottom: 30px;
        transition: all 0.3s ease;
      }

      .buttons {
        display: flex;
        gap: 10px;
        width: 90%;
        max-width: 400px;
        margin-bottom: 20px;
        position: relative;
      }

      button {
        padding: 15px 0;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        flex: 1;
        transition: all 0.3s ease;
        position: relative;
      }

      #yesBtn {
        background-color: #ff0066;
        color: white;
      }

      #noBtn {
        background-color: #ccc;
        color: black;
      }

      .message {
        color: #ff0066;
        font-size: 16px;
        margin-top: 8px;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }

      .message.show {
        opacity: 1;
        transform: translateY(0);
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Initial media -->
    <video id="firstMedia" autoplay muted loop playsinline>
      <source src="Before.mp4" type="video/mp4" />
    </video>

    <!-- Celebration media, hidden at first -->
    <video
      id="secondMedia"
      autoplay
      muted
      loop
      playsinline
      style="display: none"
    >
      <source src="giphy (1).mp4" type="video/mp4" />
    </video>

    <h1 id="mainText">Will you be my Valentine?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div id="messages"></div>

    <canvas id="confettiCanvas"></canvas>

    <script>
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const messagesDiv = document.getElementById("messages");
      const mainText = document.getElementById("mainText");
      const firstMedia = document.getElementById("firstMedia");
      const secondMedia = document.getElementById("secondMedia");
      const confettiCanvas = document.getElementById("confettiCanvas");
      const ctx = confettiCanvas.getContext("2d");

      const noMessages = [
        "Jel si sigurna?",
        "100% sigurna?",
        "Znači bolje ti je da kažeš DA ❤️",
        "Moooolim te... reci da 😘",
        "STVARNOO? Jel si stvarno sigurna?",
        "A neee, ajdee, reci DAA!",
        "Poslednja šansa, reci DA!",
      ];

      let noClicks = 0;
      let noWidthPercent = 50;
      let yesWidthPercent = 50;

      // Mobile canvas resize
      function resizeCanvas() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // Animate messages
      function showMessage(text) {
        const msg = document.createElement("div");
        msg.className = "message";
        msg.textContent = text;
        messagesDiv.appendChild(msg);
        setTimeout(() => {
          msg.classList.add("show");
        }, 10);
      }

      // Click No
      noBtn.addEventListener("click", () => {
        if (noClicks < noMessages.length) {
          // Shrink No, grow Yes
          noWidthPercent = Math.max(10, 50 - noClicks * 6);
          yesWidthPercent = 100 - noWidthPercent;
          yesBtn.style.flex = yesWidthPercent;
          noBtn.style.flex = noWidthPercent;

          // Show playful message
          const msgText =
            noWidthPercent < 15 ? "Say yes 😇" : noMessages[noClicks];
          showMessage(msgText);

          noClicks++;

          // Hide No after last click
          if (noClicks >= noMessages.length) {
            noBtn.style.display = "none";
          }
        }
      });

      // Click Yes
      yesBtn.addEventListener("click", () => {
        // Disable buttons
        yesBtn.disabled = true;
        noBtn.disabled = true;

        // Change main text
        mainText.textContent = "TOOOOOO! ❤️";

        // Hide buttons and messages
        yesBtn.style.display = "none";
        noBtn.style.display = "none";
        messagesDiv.innerHTML = "";

        // Swap media: hide first, show second
        firstMedia.style.display = "none";
        secondMedia.style.display = "block";

        // Start confetti
        startConfetti();
      });

      // Confetti setup
      const confettiPieces = [];
      const colors = ["#ff0066", "#ff99cc", "#ff66aa", "#ff3399"];

      function startConfetti() {
        for (let i = 0; i < 150; i++) {
          confettiPieces.push({
            x: Math.random() * confettiCanvas.width,
            y: Math.random() * confettiCanvas.height - confettiCanvas.height,
            r: Math.random() * 6 + 2,
            dx: (Math.random() - 0.5) * 4,
            dy: Math.random() * 5 + 2,
            color: colors[Math.floor(Math.random() * colors.length)],
          });
        }
        requestAnimationFrame(animateConfetti);
      }

      function animateConfetti() {
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        for (let i = 0; i < confettiPieces.length; i++) {
          const p = confettiPieces[i];
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          p.x += p.dx;
          p.y += p.dy;

          if (p.y > confettiCanvas.height) {
            p.y = -10;
            p.x = Math.random() * confettiCanvas.width;
          }
        }
        requestAnimationFrame(animateConfetti);
      }
    </script>
  </body>
</html>
